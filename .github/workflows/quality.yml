name: quality

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          # The floor this project declares for itself
          # (docs/adr/0008-implementation-runtime-python.md).
          python-version: "3.12"

      - name: Install pinned tooling
        run: python -m pip install -r requirements-dev.txt

      # One definition of the gate, in the Makefile. CI does not restate it.
      - name: Quality gate
        run: make quality
