name: quality

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      # Actions are pinned to commit SHAs, not tags: a tag can be repointed, so
      # a tagged action can change a build under a branch nobody touched. The
      # tag beside each SHA is a label for readers, not the pin. To bump one,
      # `git ls-remote https://github.com/<owner>/<repo> refs/tags/<tag>` prints
      # the SHA to move to; change the SHA and its tag comment together.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          # The floor this project declares for itself
          # (docs/adr/0008-implementation-runtime-python.md).
          python-version: "3.12"

      - name: Install pinned tooling
        run: python -m pip install -r requirements-dev.txt

      # One definition of the gate, in the Makefile. CI does not restate it.
      - name: Quality gate
        run: make quality
